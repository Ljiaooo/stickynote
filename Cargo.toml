[package]
name = "stickynote"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.35"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "8"
tray-icon = "0.24"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
